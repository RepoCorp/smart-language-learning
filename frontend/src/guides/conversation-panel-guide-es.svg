<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 930 600" role="img" aria-labelledby="title desc">
  <title id="title">Guía de controles de conversación</title>
  <desc id="desc">Un panel de conversación anotado de Smart Learn que muestra el objetivo, escuchar y enviar, pausar, terminar y más controles.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#203526" flood-opacity=".16"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#6a806d"/></marker>
  </defs>
  <rect width="930" height="600" rx="24" fill="#f7faf5"/>
  <rect x="180" y="24" width="430" height="548" rx="20" fill="#fff" stroke="#cbd8c9" stroke-width="2" filter="url(#shadow)"/>
  <rect x="202" y="46" width="386" height="106" rx="14" fill="#fbfcfa" stroke="#8aaeb0" stroke-width="1.5"/>
  <text x="222" y="72" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#4d596a">OBJETIVO</text>
  <rect x="500" y="57" width="69" height="26" rx="9" fill="#fff" stroke="#ccd4dc"/>
  <text x="508" y="75" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#536071">Nuevo objetivo</text>
  <text x="222" y="98" font-family="Arial, sans-serif" font-size="13" fill="#202938">Pide un medicamento y confirma</text>
  <text x="222" y="117" font-family="Arial, sans-serif" font-size="13" fill="#202938">si es adecuado para ti.</text>
  <rect x="202" y="178" width="386" height="354" rx="16" fill="#fcfefd" stroke="#8de0d3" stroke-width="1.5"/>
  <circle cx="223" cy="210" r="7" fill="#eb3b39"/><circle cx="223" cy="210" r="11" fill="#eb3b39" opacity=".2"/>
  <text x="240" y="216" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#107f74">Escuchando… 8s</text>
  <rect x="536" y="192" width="40" height="40" rx="11" fill="#118477"/>
  <path d="M547 213l18-8-6 18-4-7z" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"/>
  <rect x="218" y="244" width="354" height="50" rx="11" fill="#fff" stroke="#ccd3dc" stroke-width="1.3"/>
  <text x="374" y="275" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#566173">Pausar</text>
  <rect x="218" y="307" width="354" height="50" rx="11" fill="#fff4f4" stroke="#ff9b9c" stroke-width="1.3"/>
  <text x="395" y="338" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#ab2529">Terminar conversación</text>
  <rect x="218" y="373" width="354" height="62" rx="12" fill="#fff" stroke="#8aaeb0" stroke-width="1.3"/>
  <text x="234" y="410" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#4d596a">Más controles</text>
  <path d="M550 399l9 9 9-9" fill="none" stroke="#536071" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
  <g font-family="Arial, sans-serif" fill="#3b5440">
    <circle cx="56" cy="90" r="15" fill="#dbead7"/><text x="51" y="96" font-size="15" font-weight="700">1</text>
    <text x="78" y="86" font-size="14" font-weight="700">Tu objetivo</text>
    <text x="78" y="105" font-size="12">marca la dirección.</text>
    <circle cx="624" cy="211" r="15" fill="#dbead7"/><text x="619" y="217" font-size="15" font-weight="700">3</text>
    <text x="646" y="207" font-size="14" font-weight="700">Envía tu mensaje</text>
    <text x="646" y="226" font-size="12">al terminar de hablar.</text>
    <circle cx="55" cy="238" r="15" fill="#dbead7"/><text x="50" y="244" font-size="15" font-weight="700">2</text>
    <text x="77" y="234" font-size="14" font-weight="700">Escuchando</text>
    <text x="77" y="253" font-size="12">Habla cuando el punto rojo esté activo.</text>
    <circle cx="624" cy="300" r="15" fill="#dbead7"/><text x="619" y="306" font-size="15" font-weight="700">4</text>
    <text x="646" y="296" font-size="14" font-weight="700">Pausar</text>
    <text x="646" y="315" font-size="12">Toma un descanso y continúa.</text>
    <circle cx="56" cy="405" r="15" fill="#dbead7"/><text x="51" y="411" font-size="15" font-weight="700">5</text>
    <text x="78" y="401" font-size="14" font-weight="700">Más controles</text>
    <text x="78" y="420" font-size="12">Pide ayuda o ajusta la velocidad.</text>
    <circle cx="624" cy="365" r="15" fill="#dbead7"/><text x="619" y="371" font-size="15" font-weight="700">6</text>
    <text x="646" y="361" font-size="14" font-weight="700">Terminar conversación</text>
    <text x="646" y="380" font-size="12">Termina cuando acabes.</text>
  </g>
  <g fill="none" stroke="#6a806d" stroke-width="1.8" marker-end="url(#arrow)">
    <path d="M144 94h58"/><path d="M621 228h-31l-15-16"/><path d="M145 242h58l40-27"/><path d="M621 305h-41l-9-32"/><path d="M145 409h73"/><path d="M621 370h-49v-37"/>
  </g>
</svg>
