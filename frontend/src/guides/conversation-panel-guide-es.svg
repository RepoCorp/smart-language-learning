<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 510" role="img" aria-labelledby="title desc">
  <title id="title">Guía de controles de conversación</title>
  <desc id="desc">Un panel de conversación anotado de Smart Learn que muestra el mensaje de la asistente, el estado de escucha, enviar, pausar, terminar y más controles.</desc>
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#203526" flood-opacity=".16"/></filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 8 4 0 8Z" fill="#6a806d"/></marker>
  </defs>
  <rect width="720" height="510" rx="24" fill="#f7faf5"/>
  <rect x="166" y="24" width="388" height="455" rx="20" fill="#fff" stroke="#cbd8c9" stroke-width="2" filter="url(#shadow)"/>
  <text x="194" y="59" font-family="Georgia, serif" font-size="20" font-weight="700" fill="#26382a">Práctica de conversación</text>
  <rect x="194" y="84" width="194" height="52" rx="15" fill="#edf4ea"/>
  <text x="211" y="106" font-family="Arial, sans-serif" font-size="13" font-weight="700" fill="#395a40">ASISTENTE</text>
  <text x="211" y="125" font-family="Arial, sans-serif" font-size="14" fill="#253528">Hallo! Wie geht es dir?</text>
  <rect x="194" y="155" width="332" height="96" rx="14" fill="#f7faf5" stroke="#d8e2d6"/>
  <circle cx="215" cy="181" r="6" fill="#4f9a61"/>
  <text x="231" y="186" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#314b36">Escuchando · 08s</text>
  <rect x="464" y="170" width="42" height="42" rx="12" fill="#47965b"/>
  <path d="M476 191h14m-6-6 6 6-6 6" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="194" y="268" width="332" height="42" rx="10" fill="#eef4ed" stroke="#9fb99f"/>
  <text x="215" y="294" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#36533a">Pausar</text>
  <rect x="194" y="320" width="332" height="42" rx="10" fill="#fff4f3" stroke="#d9aaa5"/>
  <text x="215" y="346" font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#9a423a">Terminar conversación</text>
  <rect x="194" y="380" width="332" height="72" rx="12" fill="#f5f8f4" stroke="#d8e2d6"/>
  <text x="214" y="407" font-family="Arial, sans-serif" font-size="15" font-weight="700" fill="#304d36">▾  Más controles</text>
  <text x="214" y="432" font-family="Arial, sans-serif" font-size="12" fill="#5b705f">Pedir ayuda · Velocidad · Nivel</text>
  <g font-family="Arial, sans-serif" fill="#3b5440">
    <circle cx="55" cy="108" r="15" fill="#dbead7"/><text x="50" y="114" font-size="15" font-weight="700">1</text>
    <text x="77" y="104" font-size="14" font-weight="700">La asistente habla</text>
    <text x="77" y="123" font-size="12">Escucha primero, sin prisa.</text>
    <circle cx="568" cy="185" r="15" fill="#dbead7"/><text x="563" y="191" font-size="15" font-weight="700">2</text>
    <text x="590" y="181" font-size="14" font-weight="700">Empieza a escuchar</text>
    <text x="590" y="200" font-size="12">automáticamente.</text>
    <circle cx="58" cy="224" r="15" fill="#dbead7"/><text x="53" y="230" font-size="15" font-weight="700">3</text>
    <text x="80" y="220" font-size="14" font-weight="700">Habla y después envía</text>
    <text x="80" y="239" font-size="12">tu mensaje cuando quieras.</text>
    <circle cx="566" cy="340" r="15" fill="#dbead7"/><text x="561" y="346" font-size="15" font-weight="700">4</text>
    <text x="588" y="336" font-size="14" font-weight="700">Pausa o termina</text>
    <text x="588" y="355" font-size="12">cuando lo necesites.</text>
    <circle cx="55" cy="414" r="15" fill="#dbead7"/><text x="50" y="420" font-size="15" font-weight="700">5</text>
    <text x="77" y="410" font-size="14" font-weight="700">¿Necesitas apoyo?</text>
    <text x="77" y="429" font-size="12">Abre Más controles.</text>
  </g>
  <g fill="none" stroke="#6a806d" stroke-width="1.8" marker-end="url(#arrow)">
    <path d="M142 112h44"/><path d="M566 207h-52l-10-17"/><path d="M144 228h49l17-33"/><path d="M564 350h-37"/><path d="M143 418h49"/>
  </g>
</svg>
